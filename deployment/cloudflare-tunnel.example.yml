tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: D:/LMS-Server/secrets/cloudflared-00000000-0000-0000-0000-000000000000.json

originRequest:
  connectTimeout: 10s
  noTLSVerify: false

ingress:
